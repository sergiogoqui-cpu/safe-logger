[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safe-logger"
version = "0.1.0"
description = "Python logging that masks secrets and neutralises untrusted input (log injection, ANSI tricks). Zero dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Sergio Gómez" }]
keywords = ["logging", "security", "redaction", "secrets", "log-injection", "json-logs"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: System :: Logging",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/sergiogoqui-cpu/safe-logger"
Issues = "https://github.com/sergiogoqui-cpu/safe-logger/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/safe_logger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py39"
